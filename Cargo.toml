[workspace]
resolver = "3"
members = ["crates/hub-core", "bins/hub"]

[workspace.package]
version = "0.1.6"
edition = "2024"
publish = false

# The shared crates, moved together (docs/CODE.md).
[workspace.dependencies]
mdshared-app = { git = "https://github.com/Kaan88/markdown-shared-rs", rev = "5665039d08d1e97964685ac3ed6e050b69bac467" }
mdshared-text = { git = "https://github.com/Kaan88/markdown-shared-rs", rev = "5665039d08d1e97964685ac3ed6e050b69bac467" }
mdshared-ui = { git = "https://github.com/Kaan88/markdown-shared-rs", rev = "5665039d08d1e97964685ac3ed6e050b69bac467" }
mdshared-fetch = { git = "https://github.com/Kaan88/markdown-shared-rs", rev = "5665039d08d1e97964685ac3ed6e050b69bac467" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
